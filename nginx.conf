server {
  listen 4444;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Defensivo: tolerar headers grandes (el interceptor ya no envia JWT a estaticos,
  # pero esto evita el 400 historico si una cookie/authorization crece).
  large_client_header_buffers 4 16k;

  # Cabeceras de seguridad basicas (el edge Caddy anade HSTS/CSP).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Healthcheck del contenedor.
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # Nunca servir sourcemaps en produccion (defensa aunque el build no los emita).
  location ~* \.map$ { return 404; }

  # index.html sin cache (para que un deploy nuevo se vea de inmediato).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  # Assets con hash de contenido: cache larga inmutable.
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback (Angular routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
